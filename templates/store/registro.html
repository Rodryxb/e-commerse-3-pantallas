{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 col-lg-6">
        <div class="card p-4">
            <h3 class="text-center mb-4">Registro de Usuario</h3>
            <p class="text-center text-muted mb-4">Crea tu cuenta para comprar en Tenis with Rodry.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-neon w-100 mt-3">Registrarse</button>
            </form>
            <div class="mt-4 text-center">
                <a href="/login/" class="text-muted">¿Ya tienes cuenta? Inicia Sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
